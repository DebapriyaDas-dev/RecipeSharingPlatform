server:
  port: 8080

spring:
  application:
    name: api-gateway


  cloud:
    gateway:
      routes:
      - id: USER-SERVICE
        uri: lb://USER-SERVICE
        predicates: 
         - Path=/users/** 
      - id: RECIPE-SERVICE
        uri: lb://RECIPE-SERVICE
        predicates: 
         - Path=/recipes/** 
      - id: RATING-SERVICE
        uri: lb://RATING-SERVICE
        predicates: 
         - Path=/ratings/** 

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders:
                - content-type
            allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
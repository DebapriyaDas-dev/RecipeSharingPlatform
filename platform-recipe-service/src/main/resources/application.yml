server:
  port: 9091

project:
  image: images/
  
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/recipe_sharing?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    show-sql: true
    open-in-view : true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect:org.hibernate.dialect.MySQL8Dialect
  
  application:
    name: recipe-service
    
  servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 100MB
  
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
